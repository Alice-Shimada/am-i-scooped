<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Am I scooped? 你的下一个想法，有人先发表了吗？</title><desc id="desc">Research idea to native search, verified evidence, and a clear verdict.</desc>
