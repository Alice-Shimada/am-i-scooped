<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="568" viewBox="0 0 1200 568" role="img" aria-labelledby="title desc"><title id="title">Same prompt, different verdict</title><desc id="desc">Archived calibration case: ordinary search at risk; revised skill safe as of 2016-08-01. Illustrated summaries of saved outputs.</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, Noto Sans CJK SC, sans-serif">
