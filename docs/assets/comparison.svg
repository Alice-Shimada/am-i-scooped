<text x="640" y="260" font-size="15" fill="#367554" font-weight="400" >as of 2016-08-01</text>
<text x="66" y="282" font-size="12" fill="#6b7a71" font-weight="650" letter-spacing="1">PRE-CUTOFF PREDECESSORS</text>
<text x="66" y="311" font-size="18" fill="#243c34" font-weight="500" >Batch Normalization + Layer Normalization</text>
<text x="640" y="282" font-size="12" fill="#6b7a71" font-weight="650" letter-spacing="1">PRE-CUTOFF PREDECESSORS</text>
<text x="640" y="311" font-size="18" fill="#243c34" font-weight="500" >Batch Normalization + Layer Normalization</text>
<text x="66" y="356" font-size="19" fill="#3c5147" font-weight="400" >Existing components count as overlap,</text>
<text x="66" y="385" font-size="19" fill="#3c5147" font-weight="400" >even though the learned combination</text>
<text x="66" y="414" font-size="19" fill="#3c5147" font-weight="400" >remains distinct.</text>
<text x="640" y="356" font-size="19" fill="#3c5147" font-weight="400" >The learned mixture is the central claim.</text>
<text x="640" y="385" font-size="19" fill="#3c5147" font-weight="400" >Separate papers do not establish</text>
<text x="640" y="414" font-size="19" fill="#3c5147" font-weight="400" >the proposed joint mechanism.</text>
<text x="41" y="503" font-size="21" fill="#203d32" font-weight="600" >Keep the proposed combination intact when judging its novelty.</text>
<text x="42" y="538" font-size="13" fill="#65786d" font-weight="400" >Illustrated summaries of saved outputs · Calibration example · Full records linked in the case study</text>
